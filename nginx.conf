events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 50m;
    server_tokens off;

    # Trust X-Forwarded-For from Docker network and upstream proxies
    # This extracts the real client IP from the header chain
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # 认证类端点的边缘限流（纵深防御）。
    # 应用层 rate-limit 的桶在 Node 进程内存里，海量不同来源 IP 下会走
    # "两级回收后仍满则放行"的失败开放分支（见 src/lib/rate-limit.ts）。
    # 这里在边缘先按真实客户端 IP（经上面 real_ip 解析）挡一道，
    # 让暴力撞库/刷 login 的流量根本进不到进程。
    # 阈值给得宽松（60r/m + burst 20），正常一次登录只发几个请求，不会误伤。
    limit_req_zone $binary_remote_addr zone=auth:10m rate=60r/m;

    # Blog frontend
    server {
        listen 80;
        server_name boyunxi.cn localhost;

        # Proxy MinIO images
        # 注意：location 里一旦出现 add_header，server 级 add_header 不继承，故此处完整声明
        location /images/ {
            proxy_pass http://minio:9000/blog-images/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # SVG 即使被上传也能作为顶层文档执行脚本，用 sandbox CSP 封死（源头已在 upload 层拒绝）
            add_header X-Content-Type-Options "nosniff" always;
            add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; sandbox" always;
            expires 1y;
            add_header Cache-Control "public, immutable" always;
        }

        # 认证端点：套用上面的边缘限流，其余代理行为与主 location 一致
        location /api/auth/ {
            limit_req zone=auth burst=20 nodelay;
            proxy_pass http://blog:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Blog app
        location / {
            proxy_pass http://blog:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
